<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simon Game</title>
<style>
  :root{
    --bg:#1d1b3a; --panel:#2a2754; --ink:#f3f0ff; --muted:#a9a3d6;
    --green:#2fbf71; --red:#e5484d; --yellow:#f5c542; --blue:#3e8ef7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:20px; padding:20px;
    background:radial-gradient(circle at 50% 30%, #2d2a62, var(--bg) 70%);
    color:var(--ink); font-family:"Trebuchet MS","Segoe UI",sans-serif;
  }
  h1{margin:0; font-size:1.6rem; letter-spacing:.04em}
  .stats{display:flex; gap:12px}
  .stat{background:var(--panel); border-radius:12px; padding:8px 18px; text-align:center; min-width:90px}
  .stat b{display:block; font-size:1.5rem}
  .stat span{font-size:.8rem; color:var(--muted)}

  .board{
    position:relative; width:min(88vw,380px); aspect-ratio:1; border-radius:50%;
    background:#0f0e24; padding:10px; box-shadow:0 12px 40px #0008;
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .board.shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .pad{
    border:0; cursor:pointer; opacity:.55; transition:opacity .08s, transform .08s, filter .08s;
    font:inherit; color:#0008; font-weight:700; font-size:1.1rem;
  }
  .pad:focus-visible{outline:3px solid #fff; outline-offset:-6px}
  .pad.lit{opacity:1; filter:brightness(1.35) drop-shadow(0 0 18px currentColor); transform:scale(.97)}
  .pad[disabled]{cursor:not-allowed}
  #p0{background:var(--green); color:var(--green); border-radius:100% 0 0 0}
  #p1{background:var(--red); color:var(--red); border-radius:0 100% 0 0}
  #p2{background:var(--yellow); color:var(--yellow); border-radius:0 0 0 100%}
  #p3{background:var(--blue); color:var(--blue); border-radius:0 0 100% 0}
  .pad span{color:#0009; pointer-events:none}

  .hub{
    position:absolute; inset:50% auto auto 50%; transform:translate(-50%,-50%);
    width:38%; aspect-ratio:1; border-radius:50%; background:var(--bg);
    border:6px solid #0f0e24; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:6px;
  }
  .hub .big{font-size:2.2rem; font-weight:700; line-height:1}
  .hub .msg{font-size:.78rem; color:var(--muted); margin-top:4px}

  .controls{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center}
  button.ctl, select{
    font:inherit; background:var(--panel); color:var(--ink); border:2px solid #4a4690;
    border-radius:10px; padding:9px 16px; cursor:pointer;
  }
  button.ctl:hover, select:hover{border-color:#8a84ff}
  button.primary{background:#6f63ff; border-color:#6f63ff; font-weight:700}
  button.ctl[aria-pressed="true"]{background:#4a4690}
  .hint{color:var(--muted); font-size:.85rem; text-align:center; max-width:380px}
  @media (prefers-reduced-motion:reduce){.board.shake{animation:none}.pad{transition:none}}
</style>
</head>
<body>
  <h1>Simon Game</h1>

  <div class="stats">
    <div class="stat"><b id="level">0</b><span>Level</span></div>
    <div class="stat"><b id="best">0</b><span>Best</span></div>
  </div>

  <div class="board" id="board">
    <button class="pad" id="p0" aria-label="Green pad" disabled><span>Q</span></button>
    <button class="pad" id="p1" aria-label="Red pad" disabled><span>W</span></button>
    <button class="pad" id="p2" aria-label="Yellow pad" disabled><span>A</span></button>
    <button class="pad" id="p3" aria-label="Blue pad" disabled><span>S</span></button>
    <div class="hub" aria-live="polite">
      <div class="big" id="big">Ready?</div>
      <div class="msg" id="msg">Press Start</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctl primary" id="start">Start</button>
    <select id="speed" aria-label="Speed">
      <option value="700">Easy</option>
      <option value="520" selected>Normal</option>
      <option value="340">Hard</option>
    </select>
    <button class="ctl" id="strict" aria-pressed="false">Strict: off</button>
    <button class="ctl" id="sound" aria-pressed="true">Sound: on</button>
  </div>
  <p class="hint">Watch the pattern, then repeat it. Click the pads or use Q, W, A, S (or the arrow keys). Strict mode ends the game on your first mistake.</p>

<script>
const pads = [0,1,2,3].map(i => document.getElementById('p'+i));
const freqs = [329.63, 261.63, 392.00, 220.00]; // E4, C4, G4, A3 (classic Simon notes)
const keyMap = {q:0, w:1, a:2, s:3, ArrowUp:0, ArrowRight:1, ArrowLeft:2, ArrowDown:3};

const el = id => document.getElementById(id);
let sequence = [], step = 0, playing = false, accepting = false, strict = false, soundOn = true, runId = 0;
let best = 0;
try { best = Number(localStorage.getItem('simonBest')) || 0; } catch(e){}
el('best').textContent = best;

// ---- Audio ----
let ctx;
function tone(i, ms, type='sine'){
  if(!soundOn) return;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freqs[i];
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + ms/1000);
  osc.connect(gain).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + ms/1000 + 0.05);
}
function buzz(){
  if(!soundOn) return;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = 110;
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
  osc.connect(gain).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.65);
}

// ---- Helpers ----
const wait = ms => new Promise(r => setTimeout(r, ms));
const setHub = (big, msg) => { el('big').textContent = big; el('msg').textContent = msg; };
const setPads = on => pads.forEach(p => p.disabled = !on);
const speed = () => Number(el('speed').value);

async function flash(i, ms){
  pads[i].classList.add('lit'); tone(i, ms/1000*1000*0.9);
  await wait(ms);
  pads[i].classList.remove('lit');
}

// ---- Game flow ----
async function playSequence(){
  const id = runId;
  accepting = false; setPads(false);
  setHub('Watch', 'Memorize the pattern');
  await wait(600);
  // pattern gets faster as you progress
  const ms = Math.max(160, speed() - sequence.length * 12);
  for(const i of sequence){
    if(id !== runId) return;
    await flash(i, ms);
    await wait(Math.min(220, ms * 0.4));
  }
  if(id !== runId) return;
  step = 0; accepting = true; setPads(true);
  setHub('Go!', 'Your turn');
}

function nextRound(){
  sequence.push(Math.floor(Math.random() * 4));
  el('level').textContent = sequence.length;
  playSequence();
}

function startGame(){
  runId++;
  sequence = []; playing = true;
  el('start').textContent = 'Restart';
  el('level').textContent = 0;
  nextRound();
}

async function press(i){
  if(!accepting) return;
  flash(i, 220);
  if(i === sequence[step]){
    step++;
    if(step === sequence.length){
      accepting = false; setPads(false);
      if(sequence.length > best){
        best = sequence.length; el('best').textContent = best;
        try { localStorage.setItem('simonBest', best); } catch(e){}
      }
      setHub('Nice!', 'Level ' + sequence.length + ' cleared');
      if(navigator.vibrate) navigator.vibrate(30);
      const id = runId;
      await wait(900);
      if(id === runId) nextRound();
    }
  } else {
    wrong();
  }
}

async function wrong(){
  accepting = false; setPads(false);
  buzz();
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
  el('board').classList.add('shake');
  setTimeout(() => el('board').classList.remove('shake'), 500);
  if(strict){
    setHub('Game over', 'You reached level ' + (sequence.length - 1 < 0 ? 0 : sequence.length - 1));
    playing = false; el('start').textContent = 'Play again';
  } else {
    setHub('Oops', 'Watch it again');
    const id = runId;
    await wait(1100);
    if(id === runId) playSequence();
  }
}

// ---- Events ----
pads.forEach((p, i) => p.addEventListener('pointerdown', e => { e.preventDefault(); press(i); }));
document.addEventListener('keydown', e => {
  if(e.repeat) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if(k in keyMap){ e.preventDefault(); press(keyMap[k]); }
});
el('start').addEventListener('click', startGame);
el('strict').addEventListener('click', e => {
  strict = !strict;
  e.currentTarget.setAttribute('aria-pressed', strict);
  e.currentTarget.textContent = 'Strict: ' + (strict ? 'on' : 'off');
});
el('sound').addEventListener('click', e => {
  soundOn = !soundOn;
  e.currentTarget.setAttribute('aria-pressed', soundOn);
  e.currentTarget.textContent = 'Sound: ' + (soundOn ? 'on' : 'off');
});
</script>
</body>
</html>
